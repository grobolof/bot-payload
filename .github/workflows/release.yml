name: Release

# Version is chosen by hand: push a tag or publish a GitHub Release.
# This workflow fills the short title + detailed notes, then pings Packagist.

on:
  push:
    tags:
      - "*.*.*"
      - "*.*"
      - "v*.*.*"
      - "v*.*"
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to fill GitHub Release notes for
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Generate title and notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          python3 .github/scripts/generate-release-notes.py \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --apply

  packagist:
    name: Update Packagist
    runs-on: ubuntu-latest
    needs: notes
    if: always() && needs.notes.result != 'cancelled'
    steps:
      - name: Notify packagist.org
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "PACKAGIST_USERNAME / PACKAGIST_TOKEN are not set."
            echo "If you logged in to packagist.org via GitHub, the webhook may already sync this repo."
            echo "Otherwise add the SAFE API token from https://packagist.org/profile/"
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
            -H "User-Agent: grobolof/bot-payload GitHub Actions (mailto:github.com/grobolof)" \
            "https://packagist.org/api/update-package" \
            -d '{"repository":"https://github.com/${{ github.repository }}"}'
          echo
          echo "Packagist update requested for ${{ github.repository }}"
